{% extends "auth_base.html" %}
{% block title %}Reset Access | NTRO Secure Access{% endblock %}
{% block content %}
<div class="auth-heading"><span class="step-tag">03 / RECOVER</span><h2>Reset your access.</h2><p>We will send a secure recovery code to your registered Email ID.</p></div>
<form class="auth-form" data-auth-form="forgot-password" novalidate>
  <label for="forgot-email">Registered Email ID</label>
  <div class="input-wrap"><i class="fa-regular fa-envelope"></i><input id="forgot-email" name="email" type="email" placeholder="analyst@ntro.gov.in" autocomplete="email" required></div>
  <button class="auth-submit" type="submit"><span>Send recovery code</span><i class="fa-solid fa-paper-plane"></i></button>
  <p class="auth-switch"><a href="/login"><i class="fa-solid fa-arrow-left"></i> Back to secure sign in</a></p>
</form>
{% endblock %}
